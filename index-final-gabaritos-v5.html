const frame=document.getElementById('app');
const norm=v=>String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function exact(r,sel){return ['size','material','color','finish'].every(k=>{const a=norm(r[k]),b=norm(sel[k]);return !a||!b||a===b;});}
function filesFor(win){
  const p=win.products?.find(x=>x.id===win.currentProductId)||null;
  if(!p) return [];
  const sel=win.structuredSelection||{};
  const candidates=GABARITOS.filter(r=>norm(r.product)===norm(p.name));
  let hits=candidates.filter(r=>exact(r,sel));
  if(!hits.length){const size=norm(sel.size);hits=candidates.filter(r=>size&&norm(r.size)===size);}
  if(!hits.length&&win.currentProductOptions?.structuredVariants?.length){
    const m=win.currentProductOptions.structuredVariants.find(v=>Object.entries(sel).every(([k,val])=>!val||v[k]===val));
    if(m) hits=candidates.filter(r=>!norm(r.configuration)||norm(r.configuration)===norm(m.configuration));
  }
  const out=[];const seen=new Set();
  hits.forEach(r=>r.files.forEach(f=>{if(f.url&&!seen.has(f.url)){seen.add(f.url);out.push(f)}}));
  return out;
}
