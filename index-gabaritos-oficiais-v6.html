function applyLightSkin(){
  try{
    const doc=frame.contentDocument;
    if(!doc) return;
    doc.documentElement.classList.add('light');
    try{doc.defaultView.localStorage.setItem('nexaprint-theme','light')}catch(e){}
    let style=doc.getElementById('nexaprint-light-skin');
    if(!style){
      style=doc.createElement('style');
      style.id='nexaprint-light-skin';
      doc.head.appendChild(style);
    }
    style.textContent=lightCss;
  }catch(e){console.error('NEXAPRINT skin error',e)}
}
try{localStorage.setItem('nexaprint-theme','light')}catch(e){}
frame.addEventListener('load',()=>{
  applyLightSkin();
  setTimeout(applyLightSkin,500);
  setTimeout(applyLightSkin,1500);
  setTimeout(applyLightSkin,3000);
});

function installGabaritoFix(){
  try{
    const w=frame.contentWindow, d=frame.contentDocument;
    if(!w || !d || w.__nexaGabaritoFixInstalled) return;
    w.__nexaGabaritoFixInstalled=true;

    const clean=v=>v==null?'':String(v).trim();
    const norm=v=>clean(v).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/\s+/g,' ').trim();

    function currentProduct(){
      return (w.products||[]).find(p=>p.id===w.currentProductId)||null;
    }

    function selectedConfigText(){
      // Produto/variação (modo antigo/importado): o primeiro select contém a configuração pronta.
      const mat=d.getElementById('sel-material');
      const opt=mat?.selectedOptions?.[0]?.textContent?.trim();
      if(opt && opt!=='') return opt;

      // Modo estruturado: monta o texto a partir dos selects realmente visíveis.
      const ids=['sel-size','sel-material','sel-color','sel-cobertura'];
      return ids.map(id=>d.getElementById(id)?.selectedOptions?.[0]?.textContent?.trim()||'')
        .filter(Boolean).join(' - ');
    }

    function dimensionValues(){
      const pairs=[
        ['sel-size','size'],['sel-material','material'],
        ['sel-color','color'],['sel-cobertura','finish']
      ];
      return pairs.map(([id,key])=>{
        const el=d.getElementById(id);
        const val=el?.selectedOptions?.[0]?.textContent?.trim()||el?.value||'';
        return [key,clean(val)];
      }).filter(([,v])=>v);
    }

    function findUrls(){
      const p=currentProduct();
      if(!p) return [];

      const productName=norm(p.name);
      const records=NEXA_GABARITOS.filter(r=>norm(r.product)===productName);
      if(!records.length) return [];

      const cfg=norm(selectedConfigText());
      const dims=dimensionValues().map(([,v])=>norm(v)).filter(Boolean);

      // 1) Correspondência exata da configuração.
      let exact=records.filter(r=>norm(r.config)===cfg);
      if(exact.length) return [...new Set(exact.flatMap(r=>r.urls))];

      // 2) Correspondência por todos os valores escolhidos dentro da configuração.
      let scored=records.map(r=>{
        const rc=norm(r.config);
        const score=dims.reduce((n,v)=>n+(rc.includes(v)?1:0),0);
        return {r,score};
      }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);

      if(scored.length){
        const best=scored[0].score;
        const bestRows=scored.filter(x=>x.score===best).map(x=>x.r);
        // Exigimos pelo menos todos os campos dimensionais disponíveis quando há mais de uma opção.
        if(best>=Math.min(dims.length,2)){
          return [...new Set(bestRows.flatMap(r=>r.urls))];
        }
      }

      // 3) Fallback seguro: se o produto tem apenas uma configuração com gabaritos,
      // ela pode ser usada sem risco de escolher outro produto.
      if(records.length===1) return [...new Set(records[0].urls)];

      return [];
    }

    function render(){
      const wrap=d.getElementById('wrap-template-download');
      const link=d.getElementById('template-download-link');
      if(!wrap || !link) return;

      const urls=findUrls();

      let extra=d.getElementById('nexa-gabaritos-extras');
      if(!extra){
        extra=d.createElement('div');
        extra.id='nexa-gabaritos-extras';
        extra.className='space-y-2 mt-2';
        wrap.parentNode.insertBefore(extra,wrap.nextSibling);
      }

      if(!urls.length){
        wrap.classList.add('hidden');
        extra.innerHTML='';
        return;
      }

      wrap.classList.remove('hidden');
      link.href=urls[0];
      link.target='_blank';
      link.rel='noopener';

      const title=link.querySelector('p.text-sm');
      if(title) title.textContent=urls.length>1?'Baixar Gabaritos deste Produto':'Baixar Gabarito deste Produto';

      const desc=link.querySelector('p.text-\\[11px\\]');
      if(desc) desc.textContent=urls.length>1
        ? `${urls.length} arquivos de gabarito disponíveis para esta configuração.`
        : 'Use o molde certo pra montar sua arte sem erro de tamanho ou sangria.';

      extra.innerHTML=urls.slice(1).map((u,i)=>{
        const label=/\.pdf(\?|$)/i.test(u)?'PDF':
          /\.cdr(\?|$)/i.test(u)?'CorelDRAW':
          /\.(ai)(\?|$)/i.test(u)?'Illustrator':
          /\.(psd)(\?|$)/i.test(u)?'Photoshop':'Arquivo';
        return `<a href="${u.replace(/"/g,'&quot;')}" target="_blank" rel="noopener"
          class="flex items-center gap-2 text-xs font-bold text-teal-700 bg-white border border-teal-100 hover:border-teal-400 rounded-lg px-3 py-2">
          <span>Baixar ${label} · Gabarito ${i+2}</span>
        </a>`;
      }).join('');
    }

    if(typeof w.goToProduct==='function' && !w.__nexaGoToProductWrapped){
      const original=w.goToProduct;
      w.goToProduct=function(id){
        const result=original.apply(this,arguments);
        setTimeout(render,100);
        setTimeout(render,500);
        setTimeout(render,1200);
        return result;
      };
      w.__nexaGoToProductWrapped=true;
    }

    d.addEventListener('change',e=>{
      if(e.target?.tagName==='SELECT') setTimeout(render,80);
    },true);

    // O configurador troca conteúdo dinamicamente; atualiza sem bloquear a aplicação.
    const root=d.getElementById('page-product');
    if(root){
      new MutationObserver(()=>render()).observe(root,{subtree:true,childList:true});
    }

    setTimeout(render,700);
    setTimeout(render,1600);
  }catch(e){console.error('NEXA gabaritos:',e)}
}
frame.addEventListener('load',()=>setTimeout(installGabaritoFix,100));
</script>
</body>
