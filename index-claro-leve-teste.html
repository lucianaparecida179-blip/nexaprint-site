<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXAPRINT — Versão Clara e Leve</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}
  #siteFrame{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="siteFrame" title="NEXAPRINT" src="index.html"></iframe>
<script>
const frame=document.getElementById('siteFrame');
const lightCss=`
html,body{background:#ffffff!important;color:#111827!important}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
.bg-slate-950{background:#ffffff!important}
.bg-slate-900{background:#f7f9f8!important}
.bg-slate-800{background:#eef3f1!important}
.bg-slate-700{background:#d7e1de!important}
.bg-slate-950\\/60{background:rgba(255,255,255,.92)!important}
.bg-slate-950\\/90{background:rgba(255,255,255,.96)!important}
.bg-slate-900\\/80{background:rgba(247,249,248,.96)!important}
.bg-slate-900\\/90{background:rgba(247,249,248,.96)!important}
.bg-slate-900\\/60{background:rgba(247,249,248,.92)!important}
.text-white{color:#111827!important}
.text-slate-100{color:#17212b!important}
.text-slate-200{color:#26313b!important}
.text-slate-300{color:#3f4b55!important}
.text-slate-400{color:#64727d!important}
.text-slate-500{color:#7b8790!important}
.text-brand{color:#009f8f!important}
.bg-brand{background:#00b49f!important}
.border-brand{border-color:#00b49f!important}
.border-slate-800,.border-slate-700,.border-slate-800\\/50,.border-slate-800\\/80{border-color:#e1e8e5!important}
header.bg-slate-900{background:#ffffff!important;border-color:#e5ebe8!important;box-shadow:0 2px 14px rgba(15,23,42,.06)!important}
nav.bg-slate-950\\/90{background:#ffffff!important;border-color:#e5ebe8!important}
.bg-gradient-to-r.from-teal-900.via-cyan-900.to-slate-900{background:linear-gradient(90deg,#e9f8f5,#f5fffd,#e9f8f5)!important;color:#111827!important}
.from-slate-900{--tw-gradient-from:#f7f9f8 var(--tw-gradient-from-position)!important}
.via-teal-950\\/40{--tw-gradient-via:#effaf7 var(--tw-gradient-via-position)!important}
.to-slate-900{--tw-gradient-to:#f7f9f8 var(--tw-gradient-to-position)!important}
#home-categories-grid>div{aspect-ratio:1/0.86!important;box-shadow:none!important}
#home-featured-grid>div{padding:12px!important;box-shadow:none!important}
#home-featured-grid>div .h-32{height:105px!important}
#category-page-grid>div{box-shadow:none!important}
#category-page-grid>div .aspect-square{height:130px!important;aspect-ratio:auto!important}
#category-page-grid>div .p-3{padding:10px!important}
#page-home{gap:2.5rem!important}
#page-home section.pt-6{padding-top:1rem!important}
#page-home section.pt-6>div{padding:1.6rem!important;box-shadow:none!important}
#page-home section.pt-6 h2{font-size:2rem!important;line-height:1.08!important}
#page-product{padding-top:1.5rem!important;padding-bottom:2rem!important}
#page-product>.grid{gap:1.25rem!important}
#current-product-img{height:220px!important;object-fit:contain!important;background:#fff!important}
#page-product .bg-slate-900.rounded-2xl{box-shadow:none!important}
#page-product .bg-slate-950.rounded-xl{background:#fff!important}
#page-product .p-6{padding:1rem!important}
#page-product .sm\\\\:p-8{padding:1.15rem!important}
#wrap-template-download{background:#f4fbf9;border:1px solid #cfe8e3;border-radius:12px;padding:10px!important}
#wrap-template-download a{background:#fff!important;border-color:#dce9e6!important}
button.bg-brand,.bg-brand{background:#00b49f!important}
button.bg-slate-800{background:#eef3f1!important;color:#17212b!important;border-color:#dce6e2!important}
input,select,textarea{background:#fff!important;color:#111827!important;border-color:#d7e1de!important}
input::placeholder,textarea::placeholder{color:#88959e!important}
#page-admin .bg-slate-900{background:#f7f9f8!important}
#page-admin .bg-slate-950{background:#fff!important}
#page-admin .bg-slate-800{background:#eef3f1!important}
#page-admin .shadow-2xl,#page-admin .shadow-xl{box-shadow:0 6px 22px rgba(15,23,42,.06)!important}
footer.bg-slate-900{background:#f7f9f8!important;border-color:#e2e9e6!important}
@media(min-width:768px){
  #home-categories-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  #home-featured-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important}
  #category-page-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important}
  #category-page-grid>div .aspect-square{height:150px!important}
  #current-product-img{height:210px!important}
}
@media(min-width:1200px){
  #home-categories-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important}
}
`;
function applyLightSkin(){
  try{
    const doc=frame.contentDocument;
    if(!doc) return;
    doc.documentElement.classList.add('light');
    try{doc.defaultView.localStorage.setItem('nexaprint-theme','light')}catch(e){}
    let style=doc.getElementById('nexaprint-light-skin');
    if(!style){
      style=doc.createElement('style');
      style.id='nexaprint-light-skin';
      doc.head.appendChild(style);
    }
    style.textContent=lightCss;
  }catch(e){console.error('NEXAPRINT skin error',e)}
}
try{localStorage.setItem('nexaprint-theme','light')}catch(e){}
frame.addEventListener('load',()=>{
  applyLightSkin();
  setTimeout(applyLightSkin,500);
  setTimeout(applyLightSkin,1500);
});
</script>
</body>
</html>
