<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importar Base do Site — NEXAPRINT</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:#0b1120;color:#e2e8f0;margin:0;padding:32px}
main{max-width:900px;margin:auto}.card{background:#111827;border:1px solid #243244;border-radius:16px;padding:24px;margin-bottom:18px}
h1{margin-top:0;color:#fff}.muted{color:#94a3b8}.ok{color:#2dd4bf}.err{color:#f87171}
button{background:#00d2c4;color:#061016;border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=file]{width:100%;padding:12px;background:#0b1120;border:1px dashed #475569;border-radius:10px;color:#cbd5e1}
progress{width:100%;height:18px}pre{white-space:pre-wrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<main>
<div class="card">
<h1>Importar Base do Site — NEXAPRINT</h1>
<p class="muted">Importa a planilha preparada a partir da Base Mestra para as tabelas estruturadas do catálogo NEXAPRINT.</p>
<p id="auth">Verificando acesso...</p>
</div>

<div class="card">
<label><strong>Selecione NEXAPRINT_IMPORTACAO_SITE.xlsx</strong></label>
<input id="file" type="file" accept=".xlsx,.xls" disabled>
<p id="preview" class="muted">Nenhum arquivo selecionado.</p>
<button id="import" disabled>Importar catálogo para o site</button>
</div>

<div class="card">
<progress id="progress" value="0" max="100"></progress>
<p id="status" class="muted">Aguardando.</p>
<pre id="log"></pre>
</div>
</main>

<script>
const SUPABASE_URL='https://mawebqqjpzfkzuwuwopk.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_ElKoJ-b1wV8Lv_2u5mlDIw_9-btNI9A';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let rows=[];

function clean(v){return v==null?'':String(v).trim()}
function norm(v){return clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function num(v){
 if(typeof v==='number') return v;
 if(v==null||v==='') return null;
 let s=String(v).replace(/R\$\s?/g,'').replace(/\./g,'').replace(',','.');
 let n=Number(s); return Number.isFinite(n)?n:null;
}
function chunks(a,n){let o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o}

async function init(){
 const {data:{session},error:sessionError}=await db.auth.getSession();

 if(sessionError){
   $('auth').innerHTML='<span class="err">Erro ao verificar a sessão: '+sessionError.message+'</span>';
   return;
 }
 if(!session){
   $('auth').innerHTML='<span class="err">A sessão administrativa não foi encontrada. Volte ao site NEXAPRINT, entre no painel administrativo e depois abra este importador em outra aba.</span>';
   return;
 }

 const {data:profile,error}=await db.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();

 if(error){
   $('auth').innerHTML='<span class="err">Não foi possível verificar a permissão administrativa: '+error.message+'</span>';
   return;
 }
 if(!profile || profile.is_admin!==true){
   $('auth').innerHTML='<span class="err">Esta conta não possui permissão de administrador.</span>';
   return;
 }

 $('auth').innerHTML='<span class="ok">Acesso administrativo autorizado.</span>';
 $('file').disabled=false;
}

$('file').addEventListener('change',async e=>{
 const f=e.target.files[0];
 if(!f)return;
 try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const ws=wb.Sheets['IMPORT_CONFIGURACOES'];
  if(!ws) throw Error('A aba IMPORT_CONFIGURACOES não foi encontrada. Selecione a NEXAPRINT_IMPORTACAO_SITE.xlsx.');
  rows=XLSX.utils.sheet_to_json(ws,{defval:null});
  if(!rows.length) throw Error('A aba IMPORT_CONFIGURACOES está vazia.');

  const required=['configuration_id','product_name','category','configuration','size','material','printing','finish','production_days','quantity','cost_price','markup_percent','sale_price','source_url','image_url'];
  const missing=required.filter(x=>!(x in rows[0]));
  if(missing.length) throw Error('Colunas ausentes: '+missing.join(', '));

  const products=new Set(rows.map(r=>norm(r.product_name)+'-'+norm(r.category)).filter(Boolean));
  const variants=new Set(rows.map(r=>[
    norm(r.product_name),norm(r.category),norm(r.configuration),
    norm(r.size),norm(r.material),norm(r.printing),norm(r.finish)
  ].join('|')));

  $('preview').innerHTML='<span class="ok">'+rows.length.toLocaleString('pt-BR')+' configurações/preços lidos.</span> '+products.size.toLocaleString('pt-BR')+' produtos e '+variants.size.toLocaleString('pt-BR')+' configurações únicas.';
  $('import').disabled=false;
 }catch(err){
  $('preview').innerHTML='<span class="err">'+err.message+'</span>';
  rows=[];$('import').disabled=true;
 }
});

async function upsertBatches(table,data,key){
 for(const [i,b] of chunks(data,100).entries()){
  const r=await db.from(table).upsert(b,{onConflict:key});
  if(r.error) throw Error(table+' — lote '+(i+1)+': '+r.error.message);
 }
}

$('import').onclick=async()=>{
 if(!rows.length)return;
 if(!confirm('Importar '+rows.length.toLocaleString('pt-BR')+' linhas da planilha para o catálogo estruturado da NEXAPRINT?'))return;

 $('import').disabled=true;
 $('progress').value=0;
 $('log').textContent='';

 try{
  const productsMap=new Map(),variantsMap=new Map();

  for(const r of rows){
   const product=clean(r.product_name),cat=clean(r.category);
   if(!product)continue;

   const pk=norm(product)+'-'+norm(cat);

   productsMap.set(pk,{
    chave_produto:pk,
    nome:product,
    categoria:cat||null,
    url_pagina_atual_card:clean(r.source_url)||null
   });

   const vk=[pk,r.configuration,r.size,r.material,r.printing,r.finish].map(norm).join('|');

   variantsMap.set(vk,{
    chave_variante:vk,
    product_key:pk,
    configuracao:clean(r.configuration)||null,
    tamanho:clean(r.size)||null,
    material:clean(r.material)||null,
    impressao:clean(r.printing)||null,
    acabamento:clean(r.finish)||null,
    prazo_producao_dias:num(r.production_days),
    peso:num(r.weight),
    url_imagem:clean(r.image_url)||null
   });
  }

  $('log').textContent+='Produtos únicos: '+productsMap.size.toLocaleString('pt-BR')+'\n';
  $('log').textContent+='Configurações únicas: '+variantsMap.size.toLocaleString('pt-BR')+'\n';

  await upsertBatches('nexaprint_produtos',[...productsMap.values()],'chave_produto');
  $('progress').value=20;

  const productKeys=[...productsMap.keys()],productIds={};

  for(const b of chunks(productKeys,100)){
   const q=await db.from('nexaprint_produtos').select('id,chave_produto').in('chave_produto',b);
   if(q.error)throw Error('Busca dos produtos: '+q.error.message);
   (q.data||[]).forEach(x=>productIds[x.chave_produto]=x.id);
  }

  const variants=[...variantsMap.values()].map(v=>({
   produto_id:productIds[v.product_key],
   chave_variante:v.chave_variante,
   configuracao:v.configuracao,
   tamanho:v.tamanho,
   material:v.material,
   impressao:v.impressao,
   acabamento:v.acabamento,
   prazo_producao_dias:v.prazo_producao_dias,
   peso:v.peso,
   url_imagem:v.url_imagem
  })).filter(v=>v.produto_id);

  await upsertBatches('nexaprint_variantes',variants,'chave_variante');
  $('progress').value=40;

  const variantKeys=variants.map(v=>v.chave_variante),variantIds={};

  for(const b of chunks(variantKeys,100)){
   const q=await db.from('nexaprint_variantes').select('id,chave_variante').in('chave_variante',b);
   if(q.error)throw Error('Busca das configurações: '+q.error.message);
   (q.data||[]).forEach(x=>variantIds[x.chave_variante]=x.id);
  }

  const ids=[...new Set(Object.values(variantIds))];

  for(const b of chunks(ids,100)){
   const d=await db.from('nexaprint_faixas_preco').delete().in('variante_id',b);
   if(d.error)throw Error('Limpeza de preços: '+d.error.message);
  }

  const prices=rows.map(r=>{
   const pk=norm(r.product_name)+'-'+norm(r.category);
   const vk=[pk,r.configuration,r.size,r.material,r.printing,r.finish].map(norm).join('|');
   const qty=Math.round(num(r.quantity)||0);
   if(!variantIds[vk]||qty<=0)return null;

   return {
    variante_id:variantIds[vk],
    quantidade:qty,
    custo_lote_centavos:Math.round((num(r.cost_price)||0)*100),
    markup_percentual:num(r.markup_percent),
    preco_venda_importado_lote_centavos:Math.round((num(r.sale_price)||0)*100),
    preco_venda_importado_unidade_centavos:null,
    preco_calculado_lote_centavos:null
   };
  }).filter(Boolean);

  const batches=chunks(prices,100);

  for(const [i,b] of batches.entries()){
   const q=await db.from('nexaprint_faixas_preco').insert(b);
   if(q.error)throw Error('Preços — lote '+(i+1)+': '+q.error.message);

   $('progress').value=40+Math.round(((i+1)/batches.length)*60);
   $('status').textContent='Importando preços: '+Math.min((i+1)*100,prices.length).toLocaleString('pt-BR')+' de '+prices.length.toLocaleString('pt-BR');
  }

  $('progress').value=100;
  $('status').innerHTML='<span class="ok">Importação concluída com sucesso.</span>';
  $('log').textContent+='Importação concluída.\n';
  $('log').textContent+='Produtos: '+productsMap.size.toLocaleString('pt-BR')+'\n';
  $('log').textContent+='Configurações: '+variantsMap.size.toLocaleString('pt-BR')+'\n';
  $('log').textContent+='Faixas de preço: '+prices.length.toLocaleString('pt-BR')+'\n';

  alert('Base do site importada com sucesso.');
 }catch(err){
  $('status').innerHTML='<span class="err">A importação foi interrompida.</span>';
  $('log').textContent+='ERRO: '+err.message+'\n';
  $('import').disabled=false;
  alert(err.message);
 }
};

init();
</script>
</body>
</html>
