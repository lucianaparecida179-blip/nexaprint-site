<script>
function installGabaritoFix(){
  try{
    const w=frame.contentWindow, d=frame.contentDocument;
    if(!w || !d || w.__nexaGabaritoFixInstalled) return;
    w.__nexaGabaritoFixInstalled=true;

    const clean=v=>v==null?'':String(v).trim();
    const norm=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();

    function getSelected(){
      const sel={};
      const map={
        size:['sel-size','size'],
        material:['sel-material','material'],
        color:['sel-color','color'],
        finish:['sel-cobertura','sel-finish','finish']
      };
      Object.entries(map).forEach(([key,ids])=>{
        for(const id of ids){
          const el=d.getElementById(id);
          if(el && clean(el.value)!==''){ sel[key]=clean(el.value); break; }
        }
      });
      // Compatibilidade com a estrutura antiga
      if(w.structuredSelection && typeof w.structuredSelection==='object'){
        Object.entries(w.structuredSelection).forEach(([k,v])=>{
          if(clean(v)) sel[k]=clean(v);
        });
      }
      return sel;
    }

    function matches(v,sel){
      const pairs=[
        ['size',['size','tamanho']],
        ['material',['material','material_papel','materialPapel']],
        ['color',['color','cor','impressao','impressão']],
        ['finish',['finish','cobertura','acabamento']]
      ];
      return pairs.every(([logical,keys])=>{
        if(!sel[logical]) return true;
        const vv=keys.map(k=>v?.[k]).find(x=>clean(x)!=='');
        return !vv || norm(vv)===norm(sel[logical]);
      });
    }

    function getVariants(){
      const p=(w.products||[]).find(x=>x.id===w.currentProductId);
      const fromCurrent=Array.isArray(w.currentProductOptions?.structuredVariants)
        ? w.currentProductOptions.structuredVariants
        : [];
      const fromProduct=Array.isArray(p?.options?.structuredVariants)
        ? p.options.structuredVariants
        : [];
      return fromCurrent.length ? fromCurrent : fromProduct;
    }

    function update(){
      const wrap=d.getElementById('wrap-template-download');
      const link=d.getElementById('template-download-link');
      if(!wrap || !link) return;

      const p=(w.products||[]).find(x=>x.id===w.currentProductId);
      const variants=getVariants();
      const sel=getSelected();

      // Procura a variante exata. Se não houver, NÃO inventa gabarito.
      let candidates=variants.filter(v=>matches(v,sel));

      // Se a estrutura tem campos de configuração e a seleção atual é completa,
      // exigimos correspondência desses campos.
      if(variants.length && candidates.length){
        const targetKeys=['size','material','color','finish'].filter(k=>sel[k]);
        if(targetKeys.length){
          candidates=candidates.filter(v=>{
            return targetKeys.every(k=>{
              const vv={size:v.size||v.tamanho,material:v.material||v.material_papel||v.materialPapel,
                        color:v.color||v.cor||v.impressao||v.impressão,
                        finish:v.finish||v.cobertura||v.acabamento}[k];
              return clean(vv)==='' || norm(vv)===norm(sel[k]);
            });
          });
        }
      }

      let urls=[];
      candidates.forEach(v=>{
        if(Array.isArray(v.templateUrls)) urls.push(...v.templateUrls);
        if(clean(v.templateUrl)) urls.push(v.templateUrl);
        if(clean(v.template_url)) urls.push(v.template_url);
        if(Array.isArray(v.template_urls)) urls.push(...v.template_urls);
      });

      // Compatibilidade: produto só ganha gabarito se não houver variantes estruturadas.
      if(!variants.length && clean(p?.templateUrl)) urls.push(p.templateUrl);
      if(!variants.length && clean(p?.template_url)) urls.push(p.template_url);

      urls=[...new Set(urls.map(clean).filter(Boolean))];

      if(urls.length){
        wrap.classList.remove('hidden');
        if(link){
          link.href=urls[0];
          link.target='_blank';
          link.rel='noopener';
        }
        const title=link.querySelector('p');
        if(title) title.textContent=urls.length>1 ? 'Baixar Gabaritos deste Produto' : 'Baixar Gabarito deste Produto';
        const desc=link.querySelector('p.text-\\[11px\\]');
        if(desc) desc.textContent=urls.length>1 ? `${urls.length} arquivos de gabarito disponíveis para esta configuração.` : 'Use o molde certo pra montar sua arte sem erro de tamanho ou sangria.';
      }else{
        wrap.classList.add('hidden');
        link.removeAttribute('href');
      }

      // Adiciona links extras quando houver múltiplos gabaritos.
      let extra=d.getElementById('nexa-extra-gabaritos');
      if(urls.length>1){
        if(!extra){
          extra=d.createElement('div');
          extra.id='nexa-extra-gabaritos';
          extra.className='mt-2 space-y-2';
          wrap.parentNode.insertBefore(extra, wrap.nextSibling);
        }
        extra.innerHTML=urls.slice(1).map((u,i)=>`<a href="${u.replace(/"/g,'&quot;')}" target="_blank" rel="noopener" class="flex items-center gap-2 text-xs font-bold text-teal-700 bg-white border border-teal-100 hover:border-teal-400 rounded-lg px-3 py-2"><span>Baixar gabarito ${i+2}</span></a>`).join('');
      }else if(extra){
        extra.remove();
      }
    }

    // Reaproveita a função existente do site e adiciona a sincronização do gabarito.
    if(typeof w.goToProduct==='function' && !w.__nexaGoToProductWrapped){
      const original=w.goToProduct;
      w.goToProduct=function(id){
        const result=original.apply(this,arguments);
        setTimeout(update,50);
        setTimeout(update,250);
        setTimeout(update,800);
        return result;
      };
      w.__nexaGoToProductWrapped=true;
    }

    // Observa qualquer mudança nos selects do configurador.
    d.addEventListener('change',e=>{
      if(e.target && e.target.tagName==='SELECT') setTimeout(update,30);
    },true);

    // Também observa mutações porque o configurador recria selects/HTML.
    const obs=new MutationObserver(()=>update());
    const root=d.getElementById('page-product')||d.body;
    if(root) obs.observe(root,{subtree:true,childList:true});

    setTimeout(update,500);
    setTimeout(update,1500);
  }catch(e){console.error('NEXA gabarito:',e)}
}
frame.addEventListener('load',()=>setTimeout(installGabaritoFix,100));
</script>

<script>
const frame = document.getElementById('siteFrame');
let imageFixTimer = null;

function uniqUrls(arr){
  return [...new Set(arr.filter(u => typeof u === 'string' && u.trim()))];
}

function collectCandidateImages(win){
  try{
    const p = win.products?.find(x => x.id === win.currentProductId);
    if(!p) return [];
    const candidates = [];
    if(p.img) candidates.push(p.img);

    const opts = p.options || {};
    const vs = Array.isArray(opts.structuredVariants) ? opts.structuredVariants : [];
    const sel = win.structuredSelection || {};
    const matching = vs.filter(v =>
      (!sel.size || String(v.size||'') === String(sel.size)) &&
      (!sel.material || String(v.material||'') === String(sel.material)) &&
      (!sel.color || String(v.color||'') === String(sel.color)) &&
      (!sel.finish || String(v.finish||'') === String(sel.finish))
    );
    for(const v of matching){
      candidates.push(v.imageUrl, v.image_url);
      if(Array.isArray(v.imageUrls)) candidates.push(...v.imageUrls);
    }
    for(const v of vs){
      candidates.push(v.imageUrl, v.image_url);
    }
    return uniqUrls(candidates);
  }catch(e){ return []; }
}

function installImageRecovery(){
  try{
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    if(!doc || !win) return;

    const img = doc.getElementById('current-product-img');
    if(!img || img.dataset.nexaRecoveryInstalled === '1') return;

    img.dataset.nexaRecoveryInstalled = '1';
    let tried = [];

    const recover = () => {
      const candidates = collectCandidateImages(win);
      const next = candidates.find(u => !tried.includes(u));
      if(!next) return;
      tried.push(next);
      img.src = next;
    };

    img.addEventListener('error', () => {
      tried.push(img.src);
      recover();
    });

    const originalGo = win.goToProduct;
    if(typeof originalGo === 'function' && !originalGo.__nexaWrapped){
      const wrapped = function(id){
        tried = [];
        const result = originalGo.apply(this, arguments);
        setTimeout(()=>{
          const image = doc.getElementById('current-product-img');
          if(image && image.dataset.nexaErrorHandled !== '1'){
            image.dataset.nexaErrorHandled = '1';
            if(image.complete && image.naturalWidth === 0){
              image.dispatchEvent(new Event('error'));
            }
          }
        }, 250);
        return result;
      };
      wrapped.__nexaWrapped = true;
      win.goToProduct = wrapped;
    }
  }catch(e){ console.debug('NEXAPRINT image recovery', e); }
}

function startRecoveryWatcher(){
  clearInterval(imageFixTimer);
  imageFixTimer=setInterval(()=>{
    installImageRecovery();
    try{
      const img=frame.contentDocument?.getElementById('current-product-img');
      if(img && img.complete && img.naturalWidth===0 && img.dataset.nexaAutoTried!=='1'){
        img.dataset.nexaAutoTried='1';
        img.dispatchEvent(new Event('error'));
      }
    }catch(e){}
  },700);
}

frame.addEventListener('load', ()=>{
  setTimeout(installImageRecovery,400);
  setTimeout(installImageRecovery,1200);
  startRecoveryWatcher();
});
</script>

function normG(v){return (v==null?'':String(v)).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
function escG(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function getGabaritosOficial(){
  try{
    const w=frame.contentWindow, d=frame.contentDocument;
    const p=(w.products||[]).find(x=>x.id===w.currentProductId);
    if(!p) return [];
    const rec=NEXAPRINT_GABARITOS_BASE[p.name];
    if(!rec) return [];
    // Quando existe tamanho na tela, exigimos que ele corresponda ao registro da base.
    const sizeEl=d.getElementById('sel-size');
    if(sizeEl && String(sizeEl.value||'').trim() && rec.size && normG(sizeEl.value)!==normG(rec.size)) return [];
    // Para os demais campos, quando a tela mostra um valor, ele precisa estar presente na configuração oficial.
    const checks=[['sel-material'],['sel-color'],['sel-cobertura']];
    for(const ids of checks){
      const el=ids.map(id=>d.getElementById(id)).find(Boolean);
      if(el && String(el.value||'').trim() && rec.config && !normG(rec.config).includes(normG(el.value))) return [];
    }
    return rec.urls||[];
  }catch(e){return []}
}
function renderOfficialGabaritos(){
  try{
    const w=frame.contentWindow, d=frame.contentDocument;
    const wrap=d.getElementById('wrap-template-download');
    if(!wrap) return;
    let host=d.getElementById('nexa-official-gabaritos');
    if(!host){
      host=d.createElement('div');
      host.id='nexa-official-gabaritos';
      wrap.parentNode.insertBefore(host, wrap.nextSibling);
    }
    const urls=getGabaritosOficial();
    if(!urls.length){ host.innerHTML=''; host.className='hidden'; return; }
    wrap.classList.add('hidden');
    host.className='mt-3';
    host.innerHTML=`<div style="background:#f4fbf9;border:1px solid #cfe8e3;border-radius:12px;padding:12px">
      <div style="display:flex;align-items:center;gap:8px;color:#008f80;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px">
        <span style="width:30px;height:30px;border-radius:8px;background:#e8f8f5;border:1px solid #cfe8e3;display:flex;align-items:center;justify-content:center">↓</span>
        Gabaritos desta configuração
      </div>
      <div style="display:grid;grid-template-columns:1fr;gap:7px">${urls.map((x,i)=>`<a href="${escG(x.url)}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #dce9e6;border-radius:9px;padding:9px 11px;text-decoration:none;color:#15202b;font-size:12px;font-weight:700">
        <span>${escG(x.label||('Gabarito '+(i+1)))}</span><span style="color:#009f8f;font-size:11px">Baixar</span></a>`).join('')}</div>
      <div style="font-size:10px;color:#6b7880;margin-top:8px">Links preservados da base oficial de gabaritos da Atual Card.</div>
    </div>`;
  }catch(e){console.warn('Gabaritos oficiais:',e)}
}

function installFinalGabaritoLayer(){
  try{
    const w=frame.contentWindow, d=frame.contentDocument;
    if(!w||!d) return;
    if(!w.__nexaFinalGabHook){
      w.__nexaFinalGabHook=true;
      const original=w.goToProduct;
      if(typeof original==='function'){
        w.goToProduct=function(){const r=original.apply(this,arguments); setTimeout(renderOfficialGabaritos,80); setTimeout(renderOfficialGabaritos,350); return r;};
      }
      ['sel-size','sel-material','sel-color','sel-cobertura'].forEach(id=>{
        const el=d.getElementById(id);
        if(el) el.addEventListener('change',()=>setTimeout(renderOfficialGabaritos,40));
      });
      const obs=new MutationObserver(()=>renderOfficialGabaritos());
      const target=d.getElementById('page-product')||d.body;
      if(target) obs.observe(target,{subtree:true,childList:true,attributes:true,attributeFilter:['class','value']});
      w.__nexaFinalGabObserver=obs;
    }
    renderOfficialGabaritos();
  }catch(e){console.warn('Hook gabaritos:',e)}
}
</script>

<script>frame.addEventListener("load",()=>{setTimeout(installFinalGabaritoLayer,500);setTimeout(installFinalGabaritoLayer,1400);setTimeout(installFinalGabaritoLayer,2500);});</script>
